<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Simple Home Page</title>
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600">DEV</h1>

      <ul class="hidden md:flex gap-8 font-medium">
        <li><a href="#" class="hover:text-blue-600">Home</a></li>
        <li><a href="#" class="hover:text-blue-600">About</a></li>
        <li><a href="#" class="hover:text-blue-600">Services</a></li>
        <li><a href="#" class="hover:text-blue-600">Contact</a></li>
      </ul>

      <button class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
        Sign Up
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="py-20">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center gap-10">

      <div class="flex-1 text-center md:text-left">
        <h1 class="text-5xl font-bold mb-6">
          Build Modern Websites
        </h1>

        <p class="text-gray-600 text-lg mb-8">
          Create responsive and beautiful websites using HTML and Tailwind CSS.
        </p>

        <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
          Get Started
        </button>
      </div>

      <div class="flex-1">
        <img
          src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
          alt="Coding"
          class="rounded-xl shadow-lg"
        >
      </div>

    </div>
  </section>

  <!-- Features Section -->
  <section class="pb-20">
    <div class="max-w-6xl mx-auto px-6">

      <div class="grid md:grid-cols-3 gap-6">

        <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
          <h2 class="text-2xl font-bold mb-3">Fast</h2>
          <p class="text-gray-600">
            Optimized for speed and performance.
          </p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
          <h2 class="text-2xl font-bold mb-3">Responsive</h2>
          <p class="text-gray-600">
            Looks great on all devices.
          </p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
          <h2 class="text-2xl font-bold mb-3">Clean UI</h2>
          <p class="text-gray-600">
            Modern and user-friendly design.
          </p>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
